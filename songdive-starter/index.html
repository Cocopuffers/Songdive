<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SongDive — Daily Seven</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><div class="brand">♫ SONGDIVE <span>DEMO</span></div><section id="welcome"><h1>How deep does your music knowledge go?</h1><p>7 prompts. 7 songs. Four scoring tiers.</p><button id="start">Play today's seven</button><p class="fine">Prototype: limited verified demo catalog, not a complete song database.</p></section><section id="game" hidden><div class="row"><span id="round"></span><span id="clock"></span><span id="total"></span></div><div class="bar"><div id="progress"></div></div><h2 id="prompt"></h2><label for="search">Search a song</label><input id="search" placeholder="Song title or artist" autocomplete="off"><div id="results" role="listbox"></div><div id="feedback" aria-live="polite"></div><button id="next" hidden>Next round →</button></section><section id="end" hidden><h1>You've finished the dive!</h1><div class="score" id="final"></div><p>Maximum possible: 630 points.</p><button id="share">Copy my score</button><button id="again" class="secondary">Play again (demo)</button></section></main><script src="script.js"></script></body></html>
